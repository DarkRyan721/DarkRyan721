name: Ingest README images

on:
  workflow_dispatch:
  push:
    paths:
      - assets/images.json

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install sharp --no-save
      - run: node scripts/ingest.mjs
      - run: node scripts/compose.mjs
      - run: node scripts/rotate.mjs
      - name: Commit optimized photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/photos assets/rows README.md
          git diff --cached --quiet || git commit -m "chore: ingest optimized README images"
          git push
